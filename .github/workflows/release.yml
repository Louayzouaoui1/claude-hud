# Every push to main that touches the app builds a universal ClaudeHUD.app, publishes it as a
# GitHub release and points the Homebrew cask at it, so `brew upgrade` always gets the latest.
# The same release also carries the Windows build (ClaudeHUD-windows-<version>.zip).
name: release

on:
  push:
    branches: [main]
    paths: ["macos/**", "windows/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: echo "VERSION=1.1.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build
        working-directory: macos
        run: |
          scripts/bundle.sh "$VERSION"
          ditto -c -k --keepParent dist/ClaudeHUD.app "dist/ClaudeHUD-$VERSION.zip"
          echo "SHA=$(shasum -a 256 "dist/ClaudeHUD-$VERSION.zip" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "macos/dist/ClaudeHUD-$VERSION.zip" \
            --title "Claude HUD $VERSION" --generate-notes --target "$GITHUB_SHA"

      - name: Bump the cask
        run: |
          # Start from the latest main: an overlapping run may have bumped the cask since this one checked out.
          git fetch origin main
          git reset -q --hard origin/main
          sed -i '' -E "s/^  version \".*\"/  version \"$VERSION\"/; s/^  sha256 .*/  sha256 \"$SHA\"/" Casks/claude-hud.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/claude-hud.rb
          git commit -m "Cask: Claude HUD $VERSION"
          git push origin HEAD:main

  windows:
    needs: release
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Build and package
        run: |
          $v = "1.1.${{ github.run_number }}"
          .\windows\build.ps1
          $pkg = "ClaudeHUD-windows-$v"
          New-Item -ItemType Directory -Force "$pkg\dist" | Out-Null
          Copy-Item windows\dist\ClaudeHUD.exe, windows\dist\hud-hook.exe, windows\dist\claudehud.ico "$pkg\dist"
          Copy-Item windows\install.ps1, windows\uninstall.ps1, "windows\Install Claude HUD.cmd" $pkg
          Compress-Archive -Path $pkg -DestinationPath "$pkg.zip"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v1.1.${{ github.run_number }}" "ClaudeHUD-windows-1.1.${{ github.run_number }}.zip"
