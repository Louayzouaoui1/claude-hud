name: Bug report
description: Something in Claude HUD doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Screenshots help (blur your prompts if needed).
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Where does Claude Code run?
      options: [Cursor, VS Code, VS Code Insiders, Terminal / iTerm / Ghostty, JetBrains, Other]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: macOS and Claude Code versions
      placeholder: "macOS 26.1, Claude Code 2.1.289"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant lines from ~/.claude/hud/events.jsonl (optional)
      description: Remove anything private first.
      render: json
